services:
  web:
    build: .
    ports:
      # Host 8742 → container 3000
      # Over Tailscale: http://YOUR_TAILSCALE_IP:8742
      - "8742:3000"
    environment:
      NODE_ENV: production
      # Set before start: export AUTH_SECRET=...
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a long random string before compose up}
      DATABASE_PATH: /app/data/crossword.db
      PUZZLES_DIR: /app/puzzles
    volumes:
      # SQLite users / solves / streaks
      - crossword-data:/app/data
      # Drop dated YYYY-MM-DD.ipuz files here (host path, read-only in container)
      - ./puzzles:/app/puzzles:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/puzzle/today').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  crossword-data:
